<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kalvium Demo Audit — Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { font-family:'Inter',sans-serif; }
  :root { --k-red:#E8192C; --k-red-dark:#c1121f; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f5f5f5; background-image:radial-gradient(circle,#d1d5db 1px,transparent 1px);
    background-size:22px 22px;
  }
</style>
</head>
<body>

<div class="bg-white flex flex-col items-center"
     style="width:100%;max-width:400px;border-radius:8px;border:1px solid #e5e7eb;box-shadow:0 8px 40px rgba(0,0,0,0.08);padding:40px 40px 32px">
  <img src="/logo/Logo_v2_Red_2x (2).png" alt="Kalvium" style="height:30px;width:auto;margin-bottom:22px"/>
  <h1 class="text-lg font-bold text-gray-900 mb-0.5 text-center">Demo Audit</h1>
  <p class="text-xs text-gray-400 mb-7 text-center">Sign in to continue</p>
  <form id="login-form" class="w-full">
    <div class="mb-3">
      <label class="block text-[11px] font-semibold text-gray-500 mb-1.5 uppercase tracking-wide">Email</label>
      <input id="login-email" type="email" placeholder="you@kalvium.com" required
             class="w-full px-3 py-2.5 text-sm text-gray-800 border border-gray-200 outline-none"
             style="border-radius:4px" autocomplete="username"/>
    </div>
    <div class="mb-5">
      <label class="block text-[11px] font-semibold text-gray-500 mb-1.5 uppercase tracking-wide">Password</label>
      <input id="login-password" type="password" placeholder="••••••••" required
             class="w-full px-3 py-2.5 text-sm text-gray-800 border border-gray-200 outline-none"
             style="border-radius:4px" autocomplete="current-password"/>
    </div>
    <button id="login-btn" type="submit" class="w-full py-2.5 text-sm font-semibold text-white transition"
            style="background:var(--k-red);border:none;border-radius:4px;cursor:pointer">
      Sign in
    </button>
    <p id="login-error" class="hidden mt-3 text-xs text-center text-red-500"></p>
  </form>
</div>

<script>
// If already logged in, skip straight to the dashboard.
fetch('/api/v1/auth/me').then(r => { if (r.ok) window.location.href = '/static/dashboard.html'; }).catch(() => {});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/v1/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Sign in failed');
    window.location.href = '/static/dashboard.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
